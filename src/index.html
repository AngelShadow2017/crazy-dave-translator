<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>疯狂戴夫翻译器</title><style>* {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            position: relative;
            z-index: 1;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            position: relative;
            z-index: 1;
            color: #555;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .dave-bg {
            position: fixed;
            left: 0;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            background: #fff;
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: stretch;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }

            .arrow {
                transform: rotate(90deg);
                margin: 4px auto;
            }
        }

        .panel {
            border: 1px solid #000;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel h2 {
            font-size: 16px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            resize: vertical;
            background: #fff;
            border: 1px solid #000;
            padding: 12px;
            color: #000;
            font-size: 15px;
            line-height: 1.6;
            outline: none;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #000;
            background: #fff;
            color: #000;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        button:active {
            background: #000;
            color: #fff;
        }

        .btn-primary {
            background: #000;
            color: #fff;
        }

        .btn-primary:active {
            background: #fff;
            color: #000;
        }

        .arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #000;
        }

        .hint {
            margin-top: 24px;
            color: #666;
            font-size: 12px;
        }</style><script defer="defer" src="bundle.js"></script></head><body><img src="img/Dave.gif" class="dave-bg" alt=""><h1>疯狂戴夫翻译器</h1><div class="subtitle">普通文本 ⇄ 戴夫语</div><div class="container"><div class="panel"><h2>普通文本</h2><textarea id="plain" placeholder="输入你想说的话..."></textarea><div class="actions"><button class="btn-primary" onclick="doEncode()">编码为戴夫语 →</button> <button class="btn-secondary" onclick="copy('plain')">复制</button></div></div><div class="arrow">⇄</div><div class="panel"><h2>戴夫语</h2><textarea id="dave" placeholder="哇喔歪歪歪歪..."></textarea><div class="actions"><button class="btn-primary" onclick="doDecode()">← 解码为文本</button> <button class="btn-secondary" onclick="copy('dave')">复制</button></div></div></div><div class="hint">纯前端实现，数据不会上传到服务器。</div><script src="src/main.js" type="module"></script></body></html>
